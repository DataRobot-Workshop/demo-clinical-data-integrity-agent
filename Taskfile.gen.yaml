---
# File generated by DataRobot CLI, regenerate using `dr task compose`
version: '3'
env:
  ENV: testing
dotenv: ['.env', '.env.{{.ENV}}']
includes:
  agent:
    taskfile: ./agent/Taskfile.yml
    dir: ./agent
  core:
    taskfile: ./core/Taskfile.yaml
    dir: ./core
  docs:
    taskfile: ./docs/Taskfile.yaml
    dir: ./docs
  fastapi_server:
    taskfile: ./fastapi_server/Taskfile.yaml
    dir: ./fastapi_server
  frontend_web:
    taskfile: ./frontend_web/Taskfile.yaml
    dir: ./frontend_web
  infra:
    taskfile: ./infra/Taskfile.yaml
    dir: ./infra
  mcp_server:
    taskfile: ./mcp_server/Taskfile.yaml
    dir: ./mcp_server
tasks:
  default:
    desc: "ℹ️ Show all available tasks (run `task --list-all` to see hidden tasks)"
    cmds:
      - task --list --sort none
    silent: true

  start:
    desc: "💻 Prepare local development environment"
    cmds:
      - dr self update
      - dr dotenv setup --if-needed
      - task install
      - task fastapi_server:start
      - task infra:start
      - echo '✅ You are all set. Run `task dev` to start developing, or run `task deploy-dev` to deploy to DataRobot.'

  lint:
    desc: "🧹 Run linters"
    cmds:
      - task: agent:lint
      - task: core:lint
      - task: fastapi_server:lint
      - task: frontend_web:lint
      - task: infra:lint
      - task: mcp_server:lint

  install:
    desc: "🛠️ Install all dependencies"
    cmds:
      - task: agent:install
      - task: core:install
      - task: docs:install
      - task: fastapi_server:install
      - task: frontend_web:install
      - task: infra:install
      - task: mcp_server:install

  uninstall:
    desc: "🛠️ Uninstall all dependencies"
    cmds:
      - task: core:uninstall
      - task: fastapi_server:uninstall
      - task: infra:uninstall

  reinstall:
    desc: "🛠️ Reinstall all dependencies"
    cmds:
      - task: uninstall
      - task: install

  test:
    desc: "🧪 Run tests across all components"
    cmds:
      - task: agent:test
      - task: core:test
      - task: fastapi_server:test
      - task: frontend_web:test
      - task: mcp_server:test
  dev:
    desc: "🚀 Run all services together"
    cmds:
      - |
        task agent:dev &
        sleep 3
        task fastapi_server:dev &
        sleep 3
        task frontend_web:dev &
        sleep 3
        task infra:dev &
        sleep 3
        task mcp_server:dev &
        sleep 8
        echo "✅ All servers started!"
        if [[ -n "$NOTEBOOK_ID" ]]; then
          prefix="${DATAROBOT_API_ENDPOINT//api\/v2/}notebook-sessions/$NOTEBOOK_ID/ports/"
        else
          prefix="http://localhost:"
        fi
        echo "🔗 infra: ${prefix}8090"
        echo "🔗 agent: ${prefix}8842"
        echo "🔗 mcp_server: ${prefix}9000"
        echo "🔗 fastapi_server: ${prefix}8080"
        echo "🔗 frontend_web: ${prefix}5173"
        wait
  deploy:
    desc: "🚀 Deploy all services"
    env:
      AGENT_DEPLOY: "1"
    cmds:
      - task: infra:deploy
  deploy-dev:
    desc: "🚀 Deploy infrastructure and services to development"
    cmds:
      - task: infra:deploy-dev
